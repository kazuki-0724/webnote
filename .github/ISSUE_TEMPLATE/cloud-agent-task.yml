name: Cloud Agent Task
description: Cloud Agent が迷わず調査・実装・検証できる作業依頼
title: "[Cloud Agent] "
body:
  - type: markdown
    attributes:
      value: |
        Cloud Agent は、作業前に `doc/guidance.md` と関連する実装・テストを確認してください。
        既存の UI / store / repository / auth の責務境界を保ち、依頼範囲外の変更や本番データ操作・デプロイは行わないでください。
        要件に曖昧さが残る場合は、影響の小さい前提を明記して進め、実装を妨げる不明点がある場合は作業を広げずに報告してください。

  - type: dropdown
    id: task_type
    attributes:
      label: 作業種別
      options:
        - 不具合修正
        - 機能追加
        - 改善・リファクタリング
        - ドキュメント
        - その他
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目的と解決したい課題
      description: 誰が何に困っているか、なぜ対応が必要かを記載してください。
      placeholder: |
        例: ノート一覧で長いタイトルが読めず、対象のノートを見つけにくい。
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: 現状と再現手順
      description: 不具合の場合は、前提条件・操作手順・実際の結果を記載してください。新機能の場合は関連する現状を書いてください。
      placeholder: |
        1. ...
        2. ...
        実際の結果: ...
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: 期待する動作と受け入れ条件
      description: 完了を客観的に判断できる条件を、箇条書きで記載してください。
      placeholder: |
        - [ ] ... のとき ... になる
        - [ ] 既存の ... は引き続き動作する
    validations:
      required: true

  - type: checkboxes
    id: affected_areas
    attributes:
      label: 関連しそうな領域
      description: 分かる範囲で選択してください。Cloud Agent は実際の依存関係をコードで確認してください。
      options:
        - label: UI / コンポーネント
        - label: State / `src/store/notes.js`
        - label: Repository / Firestore
        - label: Auth / 権限
        - label: Utility / その他
    validations:
      required: false

  - type: textarea
    id: scope_constraints
    attributes:
      label: 変更範囲・制約・対象外
      description: 分かっている対象ファイル、変更してほしくない範囲、互換性・セキュリティ上の条件を記載してください。
      placeholder: |
        対象候補: ...
        対象外: ...
        制約: ...
    validations:
      required: false

  - type: textarea
    id: ui_requirements
    attributes:
      label: UI の条件
      description: UI に関係する場合のみ記載してください。既存テーマに従い `doc/design-theme.md` を参照してください。
      placeholder: |
        画面サイズ、表示条件、操作方法、アクセシビリティ上の条件など
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: 検証方法
      description: 必要な確認内容を記載してください。Cloud Agent は関連テストと利用可能な build / lint を実行し、実行できない項目は理由を報告してください。
      placeholder: |
        - 確認する操作・条件: ...
        - 期待結果: ...
    validations:
      required: true