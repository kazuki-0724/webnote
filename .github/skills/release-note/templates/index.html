<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リリースノート</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* bg-gray-50 */
            color: #1f2937; /* text-gray-900 */
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div class="max-w-3xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        <!-- ヘッダー部分 -->
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 sm:text-5xl">
                リリースノート
            </h1>
            <p class="mt-4 text-lg text-gray-500">
                WebNote バージョン <span class="font-bold text-blue-600">{$version}</span> の更新内容
            </p>
            <p class="mt-2 text-sm text-gray-400">
                リリース日: {$release_date}
            </p>
        </header>

        <main class="space-y-8">
            
            <!-- 概要セクション -->
            <section class="bg-blue-50 p-6 rounded-2xl border border-blue-100 mb-8">
                <h2 class="text-xl font-bold text-blue-900 mb-3">リリース概要</h2>
                <p class="text-blue-800 text-sm leading-relaxed">
                    {$summary}
                </p>
            </section>

            <!-- ファイル/コンポーネント-->
            <article class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <div class="border-b border-gray-100 pb-4 mb-4">
                    <h2 class="text-xl font-mono font-bold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        {$file_name}
                    </h2>
                    <p class="text-sm text-gray-500 mt-1">{$file_description}</p>
                </div>

                <div class="space-y-4">
                    <!-- 追加 -->
                    <div class="flex items-start">
                        <span class="inline-block mt-0.5 px-2.5 py-0.5 rounded-md text-xs font-medium bg-green-100 text-green-800 w-16 text-center mr-3 shrink-0">
                            追加
                        </span>
                        <p class="text-gray-700 text-sm">{$addition}</p>
                    </div>
                    <!-- 変更 -->
                    <div class="flex items-start">
                        <span class="inline-block mt-0.5 px-2.5 py-0.5 rounded-md text-xs font-medium bg-blue-100 text-blue-800 w-16 text-center mr-3 shrink-0">
                            変更
                        </span>
                        <p class="text-gray-700 text-sm">{$change}</p>
                    </div>
                    <!-- 削除 -->
                    <div class="flex items-start">
                        <span class="inline-block mt-0.5 px-2.5 py-0.5 rounded-md text-xs font-medium bg-gray-100 text-gray-800 w-16 text-center mr-3 shrink-0">
                            削除
                        </span>
                        <p class="text-gray-700 text-sm">{$deletion}</p>
                    </div>
                </div>
            </article>
        </main>
        <footer class="mt-16 text-center border-t border-gray-200 pt-8">
            <p class="text-sm text-gray-500">
                &copy; 2026 hogehoge Inc. All rights reserved.
            </p>
        </footer>
    </div>
</body>
</html>
