<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Functions API Tester</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #334155;
        background: #f8fafc;
      }

      body {
        box-sizing: border-box;
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 8px;
        color: #1e293b;
        font-size: 1.6rem;
      }

      .hint {
        margin: 0 0 24px;
        color: #64748b;
        line-height: 1.6;
      }

      form,
      .result {
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(15 23 42 / 6%);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label,
      .result h2 {
        color: #334155;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        color: #1e293b;
        background: #fff;
        font: inherit;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
        font-family: Consolas, monospace;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #7dd3fc;
        outline-offset: 1px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 16px;
      }

      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #0284c7;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #0369a1;
      }

      button:disabled {
        background: #94a3b8;
        cursor: wait;
      }

      .result {
        margin-top: 24px;
      }

      .result h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .status {
        margin-bottom: 12px;
        font-weight: 600;
      }

      pre {
        overflow: auto;
        max-height: 360px;
        padding: 12px;
        border-radius: 8px;
        background: #f1f5f9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 640px) {
        body {
          padding: 20px 12px;
        }

        form,
        .result {
          padding: 16px;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Cloud Functions API Tester</h1>
    <p class="hint">
      Firebase Functions の URL を入力して呼び出します。
      リクエスト内容は保存されません。
    </p>

    <form id="request-form">
      <div class="field">
        <label for="endpoint">エンドポイント URL</label>
        <input
          id="endpoint"
          name="endpoint"
          type="url"
          placeholder="http://127.0.0.1:5001/demo-project/us-central1/helloWorld"
          required
        >
      </div>

      <div class="row">
        <div class="field">
          <label for="mode">関数形式</label>
          <select id="mode" name="mode">
            <option value="http">HTTP (onRequest)</option>
            <option value="callable">Callable (onCall)</option>
          </select>
        </div>
        <div class="field">
          <label for="method">HTTP メソッド</label>
          <select id="method" name="method">
            <option>GET</option>
            <option selected>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
            <option>OPTIONS</option>
            <option>HEAD</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="headers">追加ヘッダー (JSON オブジェクト)</label>
        <textarea id="headers" name="headers" spellcheck="false">{}</textarea>
      </div>

      <div class="field">
        <label for="body">リクエスト本文</label>
        <textarea
          id="body"
          name="body"
          spellcheck="false"
          placeholder='{"prompt":"こんにちは"}'
        ></textarea>
      </div>

      <button id="submit-button" type="submit">リクエスト送信</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>レスポンス</h2>
      <div id="status" class="status">未送信</div>
      <strong>レスポンスヘッダー</strong>
      <pre id="response-headers"></pre>
      <strong>レスポンス本文</strong>
      <pre id="response-body"></pre>
    </section>

    <script>
      const form = document.getElementById("request-form");
      const modeSelect = document.getElementById("mode");
      const methodSelect = document.getElementById("method");
      const submitButton = document.getElementById("submit-button");
      const statusElement = document.getElementById("status");
      const responseHeaders = document.getElementById("response-headers");
      const responseBody = document.getElementById("response-body");

      modeSelect.addEventListener("change", () => {
        if (modeSelect.value === "callable") {
          methodSelect.value = "POST";
          methodSelect.disabled = true;
        } else {
          methodSelect.disabled = false;
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        statusElement.textContent = "送信中...";
        responseHeaders.textContent = "";
        responseBody.textContent = "";

        try {
          let headers;
          try {
            headers = JSON.parse(document.getElementById("headers").value || "{}");
          } catch (error) {
            throw new Error("ヘッダー欄の JSON を確認してください。");
          }

          const result = await fetch("/api/request", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              body: document.getElementById("body").value,
              headers,
              method: methodSelect.value,
              mode: modeSelect.value,
              url: document.getElementById("endpoint").value,
            }),
          });
          const payload = await result.json();

          if (!result.ok) {
            statusElement.textContent =
              `テストサーバーエラー (${result.status})`;
            responseBody.textContent = payload.error || "リクエストに失敗しました。";
            return;
          }

          statusElement.textContent =
            `${payload.status} ${payload.statusText} — ${payload.durationMs} ms`;
          responseHeaders.textContent =
            JSON.stringify(payload.headers, null, 2);

          let formattedBody = payload.body;
          try {
            formattedBody = JSON.stringify(JSON.parse(payload.body), null, 2);
          } catch (error) {
            // テキストレスポンスはそのまま表示します。
          }
          responseBody.textContent = formattedBody;
          if (payload.truncated) {
            responseBody.textContent += "\n\n[表示上限に達したため省略しました]";
          }
        } catch (error) {
          statusElement.textContent = "送信エラー";
          responseBody.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
